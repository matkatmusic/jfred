<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JFRED — Layer 1 View</title>
<link rel="stylesheet" href="/app/layer1-styles.css">
<!--
  Task 294: drawer highlighting reuses the vendored highlight.js; theme sheets load after layer1-styles.css.
-->
<link rel="stylesheet" href="/app/vendor/highlight-github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="/app/vendor/highlight-github-dark.min.css" media="(prefers-color-scheme: dark)">
<script src="/app/vendor/highlight.min.js"></script>
</head>
<body>
<div class="viz-root">
  <!--
    include layer1-components/top-bars/top-bars.html
  -->
  <!--
    Task 385: the Layer 8 show row mockup replaces the static legend; webapp/layer1-show-row.ts fills it per load.
  <div class="legend">
    <span><i style="background:var(--c-commit);border-radius:4px"></i> commit</span>
    <span><i style="border:3px double var(--c-disk);background:transparent"></i> on-disk</span>
    <span><i style="background:var(--c-snap)"></i> 📸 file-history snapshot (Layer 2)</span>
    <span><i style="border:3px dotted var(--muted);background:transparent"></i> created at</span>
    <span><i style="border:1.5px dashed var(--muted);background:transparent"></i> orphan bucket</span>
    <span><i style="border:1px dashed var(--c-script);background:color-mix(in srgb, var(--c-script) 11%, transparent)"></i> JSONL range</span>
  </div>
  -->
  <!--
    include layer1-components/show-row/show-row.html
  -->
  <!--
    include layer1-components/loading-bar/loading-bar.html
  -->

  <!--
    include layer1-components/popups/busy-shield.html
  -->

  <!--
    Task 246: .stagewrap doesn't scroll, so the minimap stays pinned; inside main.timelines it would scroll away.
  -->
  <div class="stagewrap" id="stagewrap">
    <!--
      Task 252: the File Nav lists every identified file, left of the ruler gutter; layer1-filenav.ts rebuilds it per load.
    -->
    <!--
      include layer1-components/file-nav/file-nav.html
    -->
    <!--
      Task 279: drag handle is a sibling, not a child, so .filenav's overflow:auto can't scroll it away.
    -->
    <!--
      include layer1-components/file-nav/filenav-grip.html
    -->
    <!--
      include layer1-components/bubbles/bubbles.html
    -->
    <!--
      include layer1-components/minimap/minimap.html
    -->
    <!--
      Task 257: drawer shows the clicked node's file bytes and shrinks the timeline; no width transition.
    -->
    <!--
      include layer1-components/details-drawer/details-drawer.html
    -->
  </div>

  <!--
    task 305: the cross-bubble refusal toast
  -->
  <!--
    include layer1-components/popups/toast.html
  -->

  <!--
    Tasks 295/296: one fixed, centred dialog serves both source lists; it edits a copy that [set and close] commits.
  -->
  <!--
    include layer1-components/popups/popups.html
  -->
  <div data-component-inspector-rows></div>
</div>
<script type="module" src="/app/layer1-page.js"></script>
<script type="module" src="/app/component-inspector/component-inspector.js"></script>
</body>
</html>
