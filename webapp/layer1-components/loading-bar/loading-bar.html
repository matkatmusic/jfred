  <!--
    Task 302: sits directly above the timeline and carries the Cancel that aborts the in-flight build.
  -->
  <div class="loadbar" id="loadbar" hidden>
    <div class="loadbar-track"><div class="loadbar-fill" id="loadbar-fill"></div></div>
    <span class="loadbar-label" id="loadbar-label"></span>
    <button id="loadbar-cancel">Cancel</button>
    <span class="loadbar-confirm" id="loadbar-confirm" hidden>Cancel this build?
      <button id="loadbar-confirm-yes">Yes, cancel</button>
      <button id="loadbar-confirm-no">No</button>
    </span>
  </div>
