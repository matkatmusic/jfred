    <aside class="detailsPaneContainer" id="detailsPaneContainer" data-component="detailsPaneContainer">
      <div class="pane-grip vertical" id="details-pane-grip" title="Drag to resize" data-component="detailsPaneResizeGrip"></div>
      <div class="dhead"><div class="dpath" id="dpath" data-component="detailsPaneFilePathText"></div>
        <!--
          tasks 299/305: ONE header control strip — zoom for an image, diff for a pair
        -->
        <!--
          task 323: cycle the selection through the file's timeline; disabled at the ends
        -->
        <span class="dtools"><button id="dprev" title="previous revision" data-component="detailsPanePreviousRevisionButton">↑</button><button id="dnext" title="next revision" data-component="detailsPaneNextRevisionButton">↓</button></span>
        <!--
          task 329: pair rows retired — each DiffView pane carries its own arrows and diff tools
        -->
        <span class="dtools" id="imgtools" hidden>
          <button id="img-zoom-out" data-component="detailsPaneImageZoomOutButton">−</button><button id="img-zoom-fit" data-component="detailsPaneImageZoomFitButton">fit</button><button id="img-zoom-in" data-component="detailsPaneImageZoomInButton">+</button>
        </span>
        <!--
          task 329: multi-file mode — drives every per-file section at once
        -->
        <span class="dtools" id="dmulti" hidden>
          <!-- <button id="dcollapse-all">collapse all</button><button id="dshow-all">show all</button> -->
          <button id="dfold-all" data-component="detailsPaneCollapseAllButton">Collapse all</button>
        </span>
        <button id="dcopylink" title="copy a link that opens this page and this node" hidden data-component="detailsPaneCopyLinkButton">Copy link</button>
        <button id="dclose" data-component="detailsPaneCloseButton">Close</button></div>
      <div class="dmeta" id="dmeta" data-component="detailsPaneMetaText"></div>
      <div class="dbody" id="dbody"></div>
    </aside>
