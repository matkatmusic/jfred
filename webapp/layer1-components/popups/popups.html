  <div class="modal-wrap" id="pathpicker" hidden>
    <div class="modal">
      <div class="mtitle" id="pp-title"></div>
      <div class="mlist" id="pp-list"></div>
      <div class="mhint">earlier folders win on conflict</div>
      <div class="malert" id="pp-alert" hidden></div>
      <div class="mbuttons">
        <button id="pp-add" title="Add a folder">+</button>
        <button id="pp-remove" title="Remove the selected folder" disabled>−</button>
        <button id="pp-up" title="Move the selected folder up" disabled>↑</button>
        <button id="pp-down" title="Move the selected folder down" disabled>↓</button>
        <span class="mspacer"></span>
        <button id="pp-cancel">cancel</button>
        <button id="pp-ok">set and close</button>
      </div>
    </div>
  </div>
