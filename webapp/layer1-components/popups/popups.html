  <div class="modal-wrap" id="pathpicker" hidden data-component="JsonlSourcePickers">
    <div class="modal" data-component="pathPickerPopup">
      <div class="mtitle" id="pp-title" data-component="pathPickerTitle"></div>
      <div class="mlist" id="pp-list" data-component="pathPickerFolderList"></div>
      <div class="mhint" data-component="pathPickerHintText">earlier folders win on conflict</div>
      <div class="malert" id="pp-alert" hidden data-component="pathPickerAlertText"></div>
      <div class="mbuttons">
        <button id="pp-add" title="Add a folder" data-component="pathPickerAddButton">+</button>
        <button id="pp-remove" title="Remove the selected folder" disabled data-component="pathPickerRemoveButton">−</button>
        <button id="pp-up" title="Move the selected folder up" disabled data-component="pathPickerMoveUpButton">↑</button>
        <button id="pp-down" title="Move the selected folder down" disabled data-component="pathPickerMoveDownButton">↓</button>
        <span class="mspacer"></span>
        <button id="pp-cancel" data-component="pathPickerCancelButton">cancel</button>
        <button id="pp-ok" data-component="pathPickerSetAndCloseButton">set and close</button>
      </div>
    </div>
  </div>
