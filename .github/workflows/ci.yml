# Task 64: the public repo's only CI — typecheck, capture-free tests, and webapp build on every
# push/PR. The executed scenario captures (scenarios/executed/, raw session transcripts) are
# gitignored in the scenarios submodule and never published, so no checkout can provide the
# JSONLs the scenario suites read — `npm run test:ci` runs exactly the tests whose imports avoid
# the capture-reading modules (scripts/list_capture_free_tests.ts); the full suite stays a local
# concern. No submodules are needed. Free on public repos (standard GitHub-hosted runners); no
# matrix or release automation until the repo has users.
name: CI

on:
    push:
        branches: [master, develop]
    pull_request:

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22          # matches devDependencies' @types/node ^22
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm run test:ci
            - run: npm run build:webapp     # catches webapp tsconfig breakage (task text)
